services:
  api:
    build: .
    environment:
      DATABASE_PATH: /data/logivista.db
      CV_WARNING_THRESHOLD: "10"
      PDI_WARNING_THRESHOLD: "15"
      ALLOWED_ORIGINS: http://localhost:5500
    ports:
      - "8000:8000"
    volumes:
      - logivista-data:/data

  dashboard:
    image: python:3.12-alpine
    command: python -m http.server 5500 --directory /frontend
    ports:
      - "5500:5500"
    volumes:
      - ./frontend:/frontend:ro
    depends_on:
      - api

volumes:
  logivista-data:
